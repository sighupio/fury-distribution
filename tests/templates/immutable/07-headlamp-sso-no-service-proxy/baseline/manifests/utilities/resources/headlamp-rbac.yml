---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sd-ui-reader
  namespace: headlamp
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    # The distribution summary every SD plugin reads.
    resourceNames: ["sd-spec"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sd-ui-reader
  namespace: headlamp
subjects:
  - kind: Group
    name: "oidc:sd-ui-viewers"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sd-ui-reader
